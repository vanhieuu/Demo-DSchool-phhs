<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App PH-HS — Dschool</title>
<style>
html,body{margin:0;min-height:100%;background:#eef0f3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.loading{min-height:100vh;display:grid;place-items:center;color:#475569}.box{text-align:center;font-size:14px}.spin{width:30px;height:30px;border:3px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;margin:0 auto 12px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loading"><div class="box"><div class="spin"></div>Đang tải demo…</div></div>
<script>
(async()=>{
  try{
    const files=Array.from({length:15},(_,i)=>`payload/part-${String(i+1).padStart(2,'0')}.txt`);
    const parts=await Promise.all(files.map(async f=>{
      const r=await fetch(f+'?v=20260908-2',{cache:'no-store'});
      if(!r.ok) throw new Error(`${f} — HTTP ${r.status}`);
      return r.text();
    }));
    const b64=parts.join('').replace(/\s/g,'');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    if(typeof DecompressionStream==='undefined') throw new Error('Trình duyệt không hỗ trợ DecompressionStream');
    const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.body.innerHTML='<pre style="padding:24px;color:#b91c1c;white-space:pre-wrap;font:14px/1.5 monospace">Không tải được demo: '+String(e)+'</pre>';
  }
})();
</script>
</body>
</html>
